[package]
name = "agencia-core"
version = "1.0.0-rc.1"
edition = "2024"
description = "Core Rust library for Agencia: macOS libproc process discovery, job runner, SQLite WAL sesiones bus, stdio MCP server, Claude UDS cartero, and Antigravity bridge."
license = "MIT"

[dependencies]
libc = "0.2.191"
parking_lot = "0.12.5"
regex = "1.13.2"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
thiserror = "2.0.21"
ureq = { version = "2.12.1", default-features = false, features = ["json"] }
walkdir = "2.5.1"
getrandom = "0.3.4"
